services:
  lodestar:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./output:/app/output        # live.json and scorecards persist on the host
    restart: unless-stopped

  # Local DeepSeek: `docker compose --profile local up`, then
  #   docker compose exec ollama ollama pull deepseek-r1:14b
  # and set LLM_PROVIDER=ollama, OLLAMA_BASE_URL=http://ollama:11434/v1 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # GPU: uncomment on an NVIDIA host with the container toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  ollama:
